name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks (incremental)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan new commits only
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}...HEAD', github.base_ref) || '-1' }}
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            -c "git config --global --add safe.directory /repo && \
                gitleaks detect --source /repo --log-opts='$BASE' --redact --exit-code 1"
