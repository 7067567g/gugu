name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-compile:
    name: Python compile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: compileall
        run: |
          python -m compileall -q \
            hermes_cli agent tools plugins \
            hermes_constants.py model_tools.py toolsets.py run_agent.py

  # Import-boundary gate: K/X/G/P class matrix from arch/architecture.yaml,
  # ratcheted against arch/baseline.json. The checker is stdlib + PyYAML only
  # (the pin is already a project dependency, pyproject.toml [project].deps).
  # Two hardening steps (r03 F2/F4):
  #   * check_boundaries.py prints parse_errors but does not fail on them; the
  #     JSON receipt it writes is consumed by prodline.gates.arch_boundaries,
  #     which exits 2 when a first-party file cannot be parsed and only passes
  #     files explicitly allowlisted. Do not add continue-on-error.
  #   * its own unit tests must run here, not only on a developer machine.
  # A violation growth must turn this check red: do not soften the step, and do
  # not rewrite the baseline from CI (baseline changes are reviewable commits,
  # see docs/architecture/classification.md).
  arch-gate:
    name: arch-gate (K/X/G/P boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gate dependencies (PyYAML + pytest pins from pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml==6.0.3 pytest==9.1.1
      - name: Check import boundaries against arch/baseline.json
        run: |
          python scripts/arch/check_boundaries.py --baseline arch/baseline.json \
            --json-out artifacts/arch/boundary-receipt.json
      - name: Gate first-party parse errors (F2; exit 2 + explicit allowlist only)
        run: |
          python -m prodline.gates.arch_boundaries \
            --receipt artifacts/arch/boundary-receipt.json
      - name: Arch checker unit tests (F4)
        run: python -m pytest scripts/arch -q

  # prodline contract gate (P1.3). The six v1 receipts stay frozen; this lane
  # proves the checker/accept pair with the real checkout's source evidence.
  # `--expect-pass` is deliberate: accept's default exit 0 covers the contract
  # case "build is SKIP", but CI must not turn an absent source stage green.
  # No soft-fail, and it is a required dependency of all-checks-passed.
  prodline-gate:
    name: prodline-gate (P1 receipts + accept source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gate dependencies (existing pins; no product deps)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml==6.0.3 pytest==9.1.1
      - name: Receipt / schema / source contract tests
        run: python -m pytest prodline/tests -q
      - name: Collect source evidence
        run: python -m prodline.stages.source --root . --out artifacts/source-evidence.json
      - name: Accept the source stage (SKIP is not PASS)
        run: |
          python -m prodline.runners.accept --only source \
            --out artifacts/receipts/acceptance-report.json --expect-pass

  desktop-typecheck:
    name: Desktop typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (lockfile; legacy peers for react-konva)
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: typecheck
        working-directory: apps/desktop
        run: npm run typecheck

  # Renderer unit tests (jsdom). The vitest config declares two projects; `ui`
  # is the renderer surface (padding / status-stack regressions live here),
  # `electron` is node-only. Installing at the root keeps the npm workspace
  # resolution identical to the typecheck lane above.
  desktop-vitest:
    name: Desktop vitest (ui project)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (lockfile; legacy peers for react-konva)
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: vitest (ui project)
        working-directory: apps/desktop
        run: npx vitest run --project ui

  # Fast cross-interpreter signal for the CI-harness test suite. The 40%
  # coverage floor lives in the dedicated `coverage` job below so the matrix
  # lane stays cheap. Both lanes install the exact [dev] pins plus the PyYAML
  # pin from [project].dependencies: `tests/ci/test_ci_workflow_wiring.py`
  # parses ci.yml as YAML, and neither lane installs the package itself, so
  # without it every run dies in collection with `ModuleNotFoundError: yaml`.
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml==6.0.3 pytest==9.1.1 pytest-cov==7.1.0
      - name: Run tests/ci
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          python -m pytest tests/ci -q

  # Wider regression lane. The fast `tests/ci` job above is intentionally
  # narrow; these two surfaces are the churn-prone paths this repo edits most,
  # so they get one dedicated 3.12 lane. The editable install makes `plugins.*`
  # and `tools.*` resolve exactly as they do locally (the tests/ci lane needs
  # neither). Single lane on purpose: this is a correctness backstop, not a
  # cross-interpreter signal, and the 40% coverage floor stays in `coverage`.
  pytest-suites:
    name: pytest suites (providers + mcp liveness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest==9.1.1 pytest-cov==7.1.0
      - name: Run provider + MCP liveness suites
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          python -m pytest \
            tests/plugins/model_providers \
            tests/tools/test_mcp_transport_liveness.py -q

  # Single canonical coverage gate. Threshold rationale: measured baseline on
  # 2026-10-18 was 43.03% (2022 statements, 1152 missing) over scripts/ci, so
  # the floor is baseline - epsilon (D-005). Keep in lockstep with
  # [tool.coverage.report] fail_under in pyproject.toml.
  coverage:
    name: coverage (scripts/ci, fail-under 40)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml==6.0.3 pytest==9.1.1 pytest-cov==7.1.0
      - name: Run tests/ci with coverage gate
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          python -m pytest tests/ci -q \
            --cov=scripts/ci \
            --cov-report=term-missing \
            --cov-fail-under=40

  # Windows build lane (A03). This job is the difference between "never ran"
  # and "ran and failed": it has NO job-level `if:` (so it cannot be skipped
  # into looking optional) and no `continue-on-error`. Only the *second* build
  # is event-gated at the step level, so a PR pays for one NSIS build while
  # push:main proves a dual build. The record step runs with `if: always()`
  # and writes a `status=fail` receipt when the build output is absent, so a
  # failed run never looks like a lane that never produced evidence. The
  # `build_gate check` step is the verdict (exit 3 == no receipt == never ran,
  # exit 1 == receipt present but rejected == ran and failed); see
  # docs/architecture/prodline/BUILD-WIN.md. The lane does not pass
  # `--exclude`: the NSIS exe embeds build/install-stamp.json's builtAt, so a
  # dual build is either genuinely byte-identical or red. `manifest-normalized`
  # stays available (and is tested) but enabling it needs A04's 7z evidence.
  build-win:
    name: build-win (Windows NSIS)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install JS workspace (lockfile; legacy peers for react-konva)
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build 1 of 2 (every event; single build on PR)
        working-directory: apps/desktop
        run: npm run dist:win:nsis
      - name: Stage build 1 output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/build | Out-Null
          if (Test-Path artifacts/build/win-1) { Remove-Item -Recurse -Force artifacts/build/win-1 }
          Move-Item apps/desktop/release artifacts/build/win-1
      - name: Build 2 of 2 (push:main only; dual build)
        if: github.ref == 'refs/heads/main'
        working-directory: apps/desktop
        run: npm run dist:win:nsis
      - name: Stage build 2 output (push:main only)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: Move-Item apps/desktop/release artifacts/build/win-2
      - name: Record build receipt (event-tiered; always writes evidence)
        if: always()
        shell: pwsh
        env:
          BUILD_EVENT: ${{ github.ref == 'refs/heads/main' && 'push-main' || 'pr' }}
        run: |
          $extra = @()
          if ($env:BUILD_EVENT -eq 'push-main') {
            $extra = @('--build-dir', 'artifacts/build/win-2')
          }
          python -m prodline.gates.build_gate record `
            --event $env:BUILD_EVENT `
            --commit $env:GITHUB_SHA `
            --build-dir artifacts/build/win-1 `
            @extra `
            --out artifacts/build/build-receipt-win.json
      - name: Gate event/tier (never-ran is not pass)
        if: always()
        shell: pwsh
        env:
          BUILD_EVENT: ${{ github.ref == 'refs/heads/main' && 'push-main' || 'pr' }}
        run: |
          python -m prodline.gates.build_gate check `
            artifacts/build/build-receipt-win.json `
            --event $env:BUILD_EVENT `
            --expect-commit $env:GITHUB_SHA
      - name: Upload Windows build receipt (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-win-receipt
          path: artifacts/build/build-receipt-win.json
          if-no-files-found: warn
          retention-days: 14

  # Linux build lane (A05). A02's artifact contract only exists if CI exercises
  # it end to end: source evidence -> two deterministic archives -> sha/bytes
  # identity -> artifact_check (zip/manifest/receipt chain) -> accept asks for
  # PASS, so a SKIP can never look green. No job-level `if:` and no
  # `continue-on-error`: a lane that cannot build must turn the aggregator red.
  # The zip is the same `artifact.zip` + `artifact-manifest.json` pair the B-side
  # consumes; uploading it keeps A04's cross-platform receipt inspectable.
  build-linux:
    name: build-linux (artifact.zip + manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gate dependencies (existing PyYAML pin; no product deps)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml==6.0.3
      - name: Collect source evidence for this commit
        run: python -m prodline.stages.source --root . --out artifacts/source-evidence.json
      - name: Build artifact twice and record the build receipt
        run: |
          python -m prodline.stages.build --root . --outdir artifacts/receipts \
            --require-source-evidence
      - name: Verify the zip/manifest/receipt chain
        run: |
          python -m prodline.gates.artifact_check \
            --zip artifacts/receipts/artifact.zip \
            --manifest artifacts/receipts/artifact-manifest.json \
            --build-receipt artifacts/receipts/build-receipt.json \
            --repo .
      - name: Accept source+build (SKIP is not PASS)
        run: |
          python -m prodline.runners.accept --only source,build --expect-pass \
            --out artifacts/receipts/acceptance-report.json
      - name: Upload Linux artifact bundle (always, so a failed build keeps evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-linux-artifact
          path: |
            artifacts/receipts/artifact.zip
            artifacts/receipts/artifact-manifest.json
            artifacts/receipts/build-receipt.json
            artifacts/receipts/acceptance-report.json
          if-no-files-found: warn
          retention-days: 14

  # Single required status check. `if: always()` makes this job report even
  # when a dependency fails; the explicit step then turns "dependency did not
  # succeed" into a red aggregator instead of a silently pending check.
  all-checks-passed:
    name: All checks passed
    if: always()
    needs:
      - python-compile
      - arch-gate
      - prodline-gate
      - build-linux
      - build-win
      - desktop-typecheck
      - desktop-vitest
      - pytest
      - pytest-suites
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: Verify every prerequisite job succeeded
        run: |
          echo "python-compile: ${{ needs.python-compile.result }}"
          echo "arch-gate: ${{ needs.arch-gate.result }}"
          echo "prodline-gate: ${{ needs.prodline-gate.result }}"
          echo "build-linux: ${{ needs.build-linux.result }}"
          echo "build-win: ${{ needs.build-win.result }}"
          echo "desktop-typecheck: ${{ needs.desktop-typecheck.result }}"
          echo "desktop-vitest: ${{ needs.desktop-vitest.result }}"
          echo "pytest: ${{ needs.pytest.result }}"
          echo "pytest-suites: ${{ needs.pytest-suites.result }}"
          echo "coverage: ${{ needs.coverage.result }}"
          test "${{ needs.python-compile.result }}" = "success"
          test "${{ needs.arch-gate.result }}" = "success"
          test "${{ needs.prodline-gate.result }}" = "success"
          test "${{ needs.build-linux.result }}" = "success"
          test "${{ needs.build-win.result }}" = "success"
          test "${{ needs.desktop-typecheck.result }}" = "success"
          test "${{ needs.desktop-vitest.result }}" = "success"
          test "${{ needs.pytest.result }}" = "success"
          test "${{ needs.pytest-suites.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success"
