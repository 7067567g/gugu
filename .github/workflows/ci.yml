name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-compile:
    name: Python compile smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: compileall
        run: |
          python -m compileall -q \
            hermes_cli agent tools plugins \
            hermes_constants.py model_tools.py toolsets.py run_agent.py

  # Import-boundary gate: K/X/G/P class matrix from arch/architecture.yaml,
  # ratcheted against arch/baseline.json. The checker is stdlib + PyYAML only
  # (the pin is already a project dependency, pyproject.toml [project].deps).
  # Two hardening steps (r03 F2/F4):
  #   * check_boundaries.py prints parse_errors but does not fail on them; the
  #     JSON receipt it writes is consumed by prodline.gates.arch_boundaries,
  #     which exits 2 when a first-party file cannot be parsed and only passes
  #     files explicitly allowlisted. Do not add continue-on-error.
  #   * its own unit tests must run here, not only on a developer machine.
  # A violation growth must turn this check red: do not soften the step, and do
  # not rewrite the baseline from CI (baseline changes are reviewable commits,
  # see docs/architecture/classification.md).
  arch-gate:
    name: arch-gate (K/X/G/P boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gate dependencies (PyYAML + pytest pins from pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml==6.0.3 pytest==9.1.1
      - name: Check import boundaries against arch/baseline.json
        run: |
          python scripts/arch/check_boundaries.py --baseline arch/baseline.json \
            --json-out artifacts/arch/boundary-receipt.json
      - name: Gate first-party parse errors (F2; exit 2 + explicit allowlist only)
        run: |
          python -m prodline.gates.arch_boundaries \
            --receipt artifacts/arch/boundary-receipt.json
      - name: Arch checker unit tests (F4)
        run: python -m pytest scripts/arch -q

  # prodline contract gate (P1.3). The six v1 receipts stay frozen; this lane
  # proves the checker/accept pair with the real checkout's source evidence.
  # `--expect-pass` is deliberate: accept's default exit 0 covers the contract
  # case "build is SKIP", but CI must not turn an absent source stage green.
  # No soft-fail, and it is a required dependency of all-checks-passed.
  prodline-gate:
    name: prodline-gate (P1 receipts + accept source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gate dependencies (existing pins; no product deps)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml==6.0.3 pytest==9.1.1
      - name: Receipt / schema / source contract tests
        run: python -m pytest prodline/tests -q
      - name: Collect source evidence
        run: python -m prodline.stages.source --root . --out artifacts/source-evidence.json
      - name: Accept the source stage (SKIP is not PASS)
        run: |
          python -m prodline.runners.accept --only source \
            --out artifacts/receipts/acceptance-report.json --expect-pass

  desktop-typecheck:
    name: Desktop typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (lockfile; legacy peers for react-konva)
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: typecheck
        working-directory: apps/desktop
        run: npm run typecheck

  # Renderer unit tests (jsdom). The vitest config declares two projects; `ui`
  # is the renderer surface (padding / status-stack regressions live here),
  # `electron` is node-only. Installing at the root keeps the npm workspace
  # resolution identical to the typecheck lane above.
  desktop-vitest:
    name: Desktop vitest (ui project)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (lockfile; legacy peers for react-konva)
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: vitest (ui project)
        working-directory: apps/desktop
        run: npx vitest run --project ui

  # Fast cross-interpreter signal for the CI-harness test suite. The 40%
  # coverage floor lives in the dedicated `coverage` job below so the matrix
  # lane stays cheap; both lanes install the exact pins from [dev] so a local
  # reproduction matches CI.
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest==9.1.1 pytest-cov==7.1.0
      - name: Run tests/ci
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          python -m pytest tests/ci -q

  # Wider regression lane. The fast `tests/ci` job above is intentionally
  # narrow; these two surfaces are the churn-prone paths this repo edits most,
  # so they get one dedicated 3.12 lane. The editable install makes `plugins.*`
  # and `tools.*` resolve exactly as they do locally (the tests/ci lane needs
  # neither). Single lane on purpose: this is a correctness backstop, not a
  # cross-interpreter signal, and the 40% coverage floor stays in `coverage`.
  pytest-suites:
    name: pytest suites (providers + mcp liveness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest==9.1.1 pytest-cov==7.1.0
      - name: Run provider + MCP liveness suites
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          python -m pytest \
            tests/plugins/model_providers \
            tests/tools/test_mcp_transport_liveness.py -q

  # Single canonical coverage gate. Threshold rationale: measured baseline on
  # 2026-10-18 was 43.03% (2022 statements, 1152 missing) over scripts/ci, so
  # the floor is baseline - epsilon (D-005). Keep in lockstep with
  # [tool.coverage.report] fail_under in pyproject.toml.
  coverage:
    name: coverage (scripts/ci, fail-under 40)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest==9.1.1 pytest-cov==7.1.0
      - name: Run tests/ci with coverage gate
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          mkdir -p "$HERMES_HOME"
          python -m pytest tests/ci -q \
            --cov=scripts/ci \
            --cov-report=term-missing \
            --cov-fail-under=40

  # Single required status check. `if: always()` makes this job report even
  # when a dependency fails; the explicit step then turns "dependency did not
  # succeed" into a red aggregator instead of a silently pending check.
  all-checks-passed:
    name: All checks passed
    if: always()
    needs:
      - python-compile
      - arch-gate
      - prodline-gate
      - desktop-typecheck
      - desktop-vitest
      - pytest
      - pytest-suites
      - coverage
    runs-on: ubuntu-latest
    steps:
      - name: Verify every prerequisite job succeeded
        run: |
          echo "python-compile: ${{ needs.python-compile.result }}"
          echo "arch-gate: ${{ needs.arch-gate.result }}"
          echo "prodline-gate: ${{ needs.prodline-gate.result }}"
          echo "desktop-typecheck: ${{ needs.desktop-typecheck.result }}"
          echo "desktop-vitest: ${{ needs.desktop-vitest.result }}"
          echo "pytest: ${{ needs.pytest.result }}"
          echo "pytest-suites: ${{ needs.pytest-suites.result }}"
          echo "coverage: ${{ needs.coverage.result }}"
          test "${{ needs.python-compile.result }}" = "success"
          test "${{ needs.arch-gate.result }}" = "success"
          test "${{ needs.prodline-gate.result }}" = "success"
          test "${{ needs.desktop-typecheck.result }}" = "success"
          test "${{ needs.desktop-vitest.result }}" = "success"
          test "${{ needs.pytest.result }}" = "success"
          test "${{ needs.pytest-suites.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success"
