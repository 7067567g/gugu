name: ✨ 功能建议
description: 提出新功能或改进（含路线图认领）
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        动手前请先读 [docs/02-三模式架构.md](../../docs/02-三模式架构.md) 与 [docs/04-roadmap.md](../../docs/04-roadmap.md)，避免重复提案。
  - type: dropdown
    id: mode
    attributes:
      label: 目标模式/区域
      options: [工作 Work, 设计 Design, 编程 Code, 桌面壳, 内核/插件 API, 文档, 其他]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      placeholder: 作为…用户，我在…场景下遇到…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
  - type: dropdown
    id: willing
    attributes:
      label: 是否愿意提 PR
      options: ["愿意，求指派", "愿意，自己开 issue 后提", "仅建议"]
  - type: checkboxes
    id: ack
    attributes:
      label: 确认
      options:
        - label: 已读 docs/02 与 CONTRIBUTING，方案与「文档先行」原则不冲突
          required: true
